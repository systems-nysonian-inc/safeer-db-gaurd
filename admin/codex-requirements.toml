# Codex managed hook for db-write-guard.
# Paste into ChatGPT Admin Console > Agent security > Edit as TOML (cloud-managed requirements),
# or let install\install-windows.ps1 -Scope Machine write it to %ProgramData%\OpenAI\Codex\requirements.toml.
# The guard files must already be on each PC at C:\ProgramData\NysonianGuard
# (run install\install-windows.ps1 -Scope Machine once per PC, or deploy that folder with Intune).
# If your requirements already have [features] or [hooks] sections, merge these keys into them.

[features]
hooks = true

[hooks]
windows_managed_dir = 'C:\ProgramData\NysonianGuard'

[[hooks.PreToolUse]]
matcher = ".*"

[[hooks.PreToolUse.hooks]]
type = "command"
command = 'C:\ProgramData\NysonianGuard\guard.cmd codex'
command_windows = 'C:\ProgramData\NysonianGuard\guard.cmd codex'
statusMessage = "Checking company AI policy"
timeout = 10
